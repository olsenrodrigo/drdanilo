<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4550" />

    <!--
      Tudo entre os marcadores abaixo é substituído por rota na pré-renderização
      (script/prerender.ts). O que está aqui é só o fallback do dev server, onde
      o useSeo preenche o head no navegador. Não inserir nada fora dos marcadores
      que dependa da rota.
    -->
    <!-- seo:start -->
    <title>Otorrinolaringologista em São Paulo | Dr. Danilo Martin Real — Otorrino e Otoneurologista</title>
    <meta name="description" content="Otorrino e otoneurologista em São Paulo. Diagnóstico e tratamento de tontura, vertigem, sinusite, dor de ouvido e de garganta, e cirurgias otorrino. Unidades no Jardim das Perdizes (Barra Funda) e no Jardim Paulista." />
    <link rel="canonical" href="https://drdaniloreal.com.br/" />
    <!-- seo:end -->

    <!--
      O framer-motion serializa opacity:0 no HTML pre-renderizado dos blocos que
      aparecem ao rolar. Sem JS, esse estado nunca seria revertido e o conteudo
      ficaria invisivel — inclusive para quem so le CSS. Isto o desfaz.
    -->
    <noscript>
      <style>
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
